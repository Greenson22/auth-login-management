name: Build Application (Windows EXE & Ubuntu DEB)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Versi paket (kosongkan untuk otomatis, mis. 1.2.1)"
        required: false
        default: ""

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "AuthLoginManager" `
            --icon "assets/images/app_icon.ico" `
            --add-data "assets;assets" `
            src/main.py

      - name: Compress Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AuthLoginManager -DestinationPath dist/AuthLoginManager-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuthLoginManager-windows-x64
          path: dist/AuthLoginManager-windows-x64.zip
          if-no-files-found: error

  build-ubuntu:
    name: Build Ubuntu DEB
    # PENTING: jangan pakai ubuntu-latest. Runner itu bergerak mengikuti
    # distro terbaru sehingga library bundelan bisa membutuhkan glibc yang
    # lebih baru daripada Ubuntu pengguna. Ubuntu 24.04 = glibc 2.39.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed \
            --name "auth-login-manager" \
            --icon "assets/images/app_icon.png" \
            --add-data "assets:assets" \
            src/main.py

      - name: Determine package version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            VERSION="0.0.0-pr${{ github.event.pull_request.number }}"
          else
            VERSION="1.0.0"
          fi

          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9][0-9A-Za-z.+~-]*$'; then
            echo "Versi tidak valid: ${VERSION}" >&2
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "PACKAGE_NAME=auth-login-manager_${VERSION}_amd64" >> "${GITHUB_ENV}"
          echo "==> Versi paket: ${VERSION}"

      - name: Package Debian (.deb)
        run: |
          bash packaging/linux/build_deb.sh "${VERSION}"

      - name: Smoke test DEB
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb "./dist/${PACKAGE_NAME}.deb"

          # Jalankan lewat Xvfb supaya plugin Qt xcb (yang dipakai desktop
          # sungguhan) benar-benar diuji. Aplikasi GUI akan berjalan terus
          # sampai dihentikan timeout.
          #
          # Exit code 124 berarti aplikasi berhasil start dan masuk event loop.
          # Exit code lain berarti aplikasi crash/gagal memuat library.
          set +e
          xvfb-run -a timeout 10 auth-login-manager > /tmp/smoke-test.log 2>&1
          SMOKE_EXIT=$?
          set -e

          echo "--- Output smoke test ---"
          cat /tmp/smoke-test.log || true
          echo "-------------------------"

          if [ "${SMOKE_EXIT}" -ne 124 ]; then
            echo "Smoke test gagal: aplikasi keluar dengan kode ${SMOKE_EXIT}." >&2
            exit 1
          fi

          echo "Smoke test OK: aplikasi berhasil start."

      - name: Upload Ubuntu DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-login-manager-ubuntu-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
