name: Build Application (Windows EXE & Ubuntu DEB)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "AuthLoginManager" `
            --icon "assets/images/app_icon.ico" `
            --add-data "assets;assets" `
            src/main.py

      - name: Compress Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AuthLoginManager -DestinationPath dist/AuthLoginManager-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuthLoginManager-windows-x64
          path: dist/AuthLoginManager-windows-x64.zip
          if-no-files-found: error

  build-ubuntu:
    name: Build Ubuntu DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "auth-login-manager" \
            --icon "assets/images/app_icon.png" \
            --add-data "assets:assets" \
            src/main.py

      - name: Create Launcher Wrapper Script
        run: |
          cat << 'EOF' > dist/auth-login-manager-wrapper
          #!/bin/sh
          exec /usr/lib/auth-login-manager/auth-login-manager "$@"
          EOF
          chmod +x dist/auth-login-manager-wrapper

      - name: Package Debian (.deb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="1.0.0"
          fi
          
          ARCH="amd64"
          PACKAGE_NAME="auth-login-manager_${VERSION}_${ARCH}"
          BUILD_ROOT="build/deb/${PACKAGE_NAME}"
          
          mkdir -p "${BUILD_ROOT}/DEBIAN"
          mkdir -p "${BUILD_ROOT}/usr/bin"
          mkdir -p "${BUILD_ROOT}/usr/lib/auth-login-manager"
          mkdir -p "${BUILD_ROOT}/usr/share/applications"
          mkdir -p "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps"
          
          # Salin isi direktori bundle PyInstaller
          cp -r dist/auth-login-manager/* "${BUILD_ROOT}/usr/lib/auth-login-manager/"
          
          # Salin wrapper ke /usr/bin
          cp dist/auth-login-manager-wrapper "${BUILD_ROOT}/usr/bin/auth-login-manager"
          chmod +x "${BUILD_ROOT}/usr/bin/auth-login-manager"
          
          # Salin Desktop Entry
          cp packaging/linux/auth-login-manager.desktop "${BUILD_ROOT}/usr/share/applications/"
          chmod 644 "${BUILD_ROOT}/usr/share/applications/auth-login-manager.desktop"
          
          # Salin Icon
          cp assets/images/app_icon.png "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps/auth-login-manager.png"
          chmod 644 "${BUILD_ROOT}/usr/share/icons/hicolor/256x256/apps/auth-login-manager.png"
          
          # Metadata DEBIAN/control
          cat <<EOF > "${BUILD_ROOT}/DEBIAN/control"
          Package: auth-login-manager
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Lemon Manis <lemon@example.com>
          Description: JSON Account Manager
           Aplikasi manajemen akun dan autentikasi JSON berbasis PyQt6 dengan dukungan sinkronisasi SQLite dan Turso.
          EOF
          
          # Buat file deb
          dpkg-deb --build --root-owner-group "${BUILD_ROOT}" "dist/${PACKAGE_NAME}.deb"

      - name: Upload Ubuntu DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-login-manager-ubuntu-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
